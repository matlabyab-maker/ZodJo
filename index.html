<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZodJo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font:12px Arial}
body{display:flex;flex-direction:column;background:#101318;color:#eee}
#top,#tabs,#bottom{display:flex;gap:2px;padding:3px;
overflow-x:auto;background:#1b2028;align-items:center}
button{border:0;border-radius:3px;padding:5px 6px;
font-size:11px;color:white;white-space:nowrap}
#top button{min-height:25px;padding:4px 6px}
#send{background:#16824a}
#file{background:#8b5a16}
#copymw{background:#345cbd}
#paste{background:#7a3ea1}
#translate{background:#087d83}
#muse{background:#a13d52}
#pcphone{background:#4b5665}
#setup{background:#555}
#addressrow{display:flex;gap:3px;padding:3px;background:#202630}
#address{flex:1;min-width:0;padding:7px;background:#0c0f13;
color:white;border:1px solid #343b46;border-radius:3px}
#go{background:#2378c7}
#view{flex:1;width:100%;border:0;background:white}
#bottom button{background:#343c48}
#status{font-size:10px;padding:3px;color:#bdc6d1}
#setupPanel{display:none;padding:7px;background:#1b2028}
#setupPanel input{width:100%;padding:6px;margin:3px 0;
background:#0c0f13;color:white;border:1px solid #343b46}
#setupPanel button{background:#346aab}
.glow button{animation:glow .5s alternate infinite}
@keyframes glow{to{filter:brightness(2)}}
</style>
</head>
<body>

<div id="top">
<button id="send">Send</button>
<button id="file">File</button>
<button id="copymw">Copy MW</button>
<button id="paste">Paste</button>
<button id="translate">Translate</button>
<button id="muse">Muse</button>
<button id="pcphone">PC/Phone</button>
<button id="setup">Setup</button>
</div>

<div id="addressrow">
<input id="address" placeholder="Enter address or search">
<button id="go">Go</button>
</div>

<div id="tabs">
<button id="tab1">Tab 1</button>
<button id="addtab">+</button>
</div>

<div id="setupPanel">
<label>Primary DNS</label>
<input id="dns1" placeholder="1.1.1.1">
<label>Secondary DNS</label>
<input id="dns2" placeholder="1.0.0.1">
<button id="saveDns">Save DNS</button>
<p>این تنظیمات فقط داخل پروژه ذخیره می‌شوند و DNS دستگاه را تغییر نمی‌دهند.</p>
</div>

<iframe id="view" title="Web content"></iframe>

<div id="status">ZodJo ready</div>

<div id="bottom">
<button id="history">History</button>
<button id="bookmark">Bookmark</button>
<button id="clean">Clean</button>
<button id="savepage">Save Page</button>
<button id="copy">Copy</button>
<button id="textsize">Text Size</button>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
let currentURL="https://www.google.com";
let phoneMode=false;
let zoom=100;
let tabCount=1;

function status(message){
    $("status").textContent=message;
    clearTimeout(window.statusTimer);
    window.statusTimer=setTimeout(()=>{
        $("status").textContent="ZodJo ready";
    },4000);
}

function navigate(value){
    let url=(value||"").trim();
    if(!url)return;

    if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(url)){
        if(url.includes(".")&&!url.includes(" ")){
            url="https://"+url;
        }else{
            url="https://www.google.com/search?q="+
                encodeURIComponent(url);
        }
    }

    currentURL=url;
    $("address").value=url;
    $("view").src=url;

    let history=[];
    try{
        history=JSON.parse(localStorage.getItem("zodjo_history")||"[]");
    }catch(e){}

    history.unshift(url);
    localStorage.setItem(
        "zodjo_history",
        JSON.stringify(history.slice(0,100))
    );

    status("Opening: "+url);
}

$("go").onclick=()=>navigate($("address").value);

$("address").addEventListener("keydown",function(event){
    if(event.key==="Enter")navigate(this.value);
});

$("setup").onclick=function(){
    const panel=$("setupPanel");
    panel.style.display=panel.style.display==="block"?"none":"block";
};

$("dns1").value=localStorage.getItem("zodjo_dns1")||"";
$("dns2").value=localStorage.getItem("zodjo_dns2")||"";

$("saveDns").onclick=function(){
    localStorage.setItem("zodjo_dns1",$("dns1").value.trim());
    localStorage.setItem("zodjo_dns2",$("dns2").value.trim());
    status("DNS preferences saved locally; system DNS unchanged");
};

$("translate").onclick=function(){
    const url=$("address").value||currentURL;
    window.open(
        "https://translate.google.com/translate?sl=auto&tl=en&u="+
        encodeURIComponent(url),
        "_blank"
    );
};

$("pcphone").onclick=function(){
    phoneMode=!phoneMode;
    $("view").style.width=phoneMode?"390px":"100%";
    $("view").style.maxWidth="100%";
    $("view").style.margin="0 auto";
    status(phoneMode?"Phone-width preview":"PC-width preview");
};

$("addtab").onclick=function(){
    tabCount++;
    const button=document.createElement("button");
    button.textContent="Tab "+tabCount;
    button.onclick=()=>status("Tab "+tabCount+" selected");
    $("tabs").insertBefore(button,$("addtab"));
    status("New tab added");
};

$("copy").onclick=async function(){
    try{
        await navigator.clipboard.writeText(
            $("address").value||currentURL
        );
        status("Address copied");
    }catch(e){
        status("Clipboard permission unavailable");
    }
};

$("copymw").onclick=async function(){
    try{
        const text=$("view").contentDocument.body.innerText;
        await navigator.clipboard.writeText(text);
        status("Page text copied");
    }catch(e){
        status("This page blocks access to its content");
    }
};

$("paste").onclick=async function(){
    try{
        $("address").value=await navigator.clipboard.readText();
        status("Pasted into address field");
    }catch(e){
        status("Clipboard permission unavailable");
    }
};

$("file").onclick=function(){
    status("File upload depends on the opened website");
};

$("send").onclick=function(){
    status("Site-specific Send requires native browser integration");
};

$("muse").onclick=function(){
    status("System-wide floating mouse requires Android integration");
};

$("history").onclick=function(){
    let history=[];
    try{
        history=JSON.parse(localStorage.getItem("zodjo_history")||"[]");
    }catch(e){}
    alert("Recent history:\n"+history.slice(0,20).join("\n"));
};

$("bookmark").onclick=function(){
    let bookmarks=[];
    try{
        bookmarks=JSON.parse(localStorage.getItem("zodjo_bookmarks")||"[]");
    }catch(e){}
    bookmarks.unshift(currentURL);
    localStorage.setItem("zodjo_bookmarks",JSON.stringify(bookmarks));
    status("Bookmarked locally");
};

$("clean").onclick=function(){
    localStorage.removeItem("zodjo_history");
    status("Local history cleared");
};

$("savepage").onclick=function(){
    const content="ZodJo page address:\n"+currentURL+"\n";
    const blob=new Blob([content],{type:"text/plain"});
    const link=document.createElement("a");
    link.href=URL.createObjectURL(blob);
    link.download="ZodJo-page.txt";
    link.click();
    URL.revokeObjectURL(link.href);
    status("Address record saved; remote page was not downloaded");
};

$("textsize").onclick=function(){
    zoom=zoom>=140?80:zoom+10;
    $("view").style.zoom=(zoom/100);
    status("Preview zoom: "+zoom+"%");
};

function hourlyEffect(){
    const now=new Date();
    if(now.getMinutes()===0&&now.getSeconds()<3){
        $("top").classList.add("glow");
        setTimeout(()=>{
            $("top").classList.remove("glow");
        },3000);
    }
}
setInterval(hourlyEffect,500);

navigate(currentURL);
})();
</script>
</body>
</html>
